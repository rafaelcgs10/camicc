[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dcp2icc"
version = "0.1.0"
description = "Convert DNG camera profiles (.dcp) to darktable-ready ICC input profiles, preserving the HueSatMap/LookTable color tables and tone curve"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
dcp2icc = "dcp2icc.cli:main"

[tool.setuptools]
packages = ["dcp2icc"]
