[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "camicc"
version = "0.1.0"
description = "Convert DNG camera profiles (.dcp) to darktable-ready ICC input profiles, preserving the HueSatMap/LookTable color tables and tone curve"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.scripts]
camicc = "camicc.cli:main"
camicc-fetch-dcps = "camicc.fetch_dcps:main"
camicc-styles = "camicc.styles:main"
# deprecated aliases, kept for one transition release
dcp2icc = "camicc.cli:main"
dcp2icc-fetch-dcps = "camicc.fetch_dcps:main"

[tool.setuptools]
packages = ["camicc"]
